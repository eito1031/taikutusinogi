<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="飼育論">
  <meta name="description" content="退屈しのぎの飼育論 - ダーク乙女ゲーム">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title>退屈しのぎの飼育論</title>
</head>
<body>

<!-- ===== タイトル画面 ===== -->
<div id="screen-title" class="screen">
  <div class="title-bg-particles"></div>

  <div class="title-content">
    <div class="title-sub">DARK OTOME VISUAL NOVEL</div>

    <h1 class="title-main">退屈しのぎの<br>飼育論</h1>

    <div class="title-chapter">Chapter 1</div>
    <div class="title-divider"></div>
    <p class="title-tagline">「こんな面白いおもちゃ、<br>他の誰かに渡すの勿体ないしね」</p>

    <div class="title-btn-group">
      <button class="btn btn-primary" id="btn-new-game">▶ はじめから</button>
      <button class="btn btn-ghost"   id="btn-title-load">続きから</button>
      <button class="btn btn-ghost"   id="btn-title-settings">設定</button>
    </div>
  </div>

  <div class="title-version">退屈しのぎの飼育論 v1.0</div>
</div>


<!-- ===== 名前入力画面 ===== -->
<div id="screen-name-input" class="screen">
  <div class="name-input-card">
    <div class="name-input-title">あなたの名前は？</div>
    <p class="name-input-sub">
      えいとが呼ぶ名前を入力してください。<br>
      例）まな と入力すると「まなちゃん」と呼ばれます。
    </p>

    <input
      type="text"
      id="name-input-field"
      class="name-field"
      maxlength="8"
      placeholder="名前を入力"
      autocomplete="off"
      spellcheck="false"
    >

    <div id="name-preview" class="name-preview">名前を入力してください</div>

    <button class="btn btn-primary" id="btn-name-confirm">決定</button>
  </div>
</div>


<!-- ===== ゲーム画面 ===== -->
<div id="screen-game" class="screen">

  <!-- スコアバー -->
  <div class="score-bar">
    <div class="score-bar-label">SCORE</div>
    <div class="score-track">
      <div id="score-fill" class="score-fill range-0" style="width:0%"></div>
    </div>
    <div id="score-num" class="score-num">0 / 60</div>
    <div id="score-end-label" class="score-end-label" style="color:#4488cc">❌ Bad END</div>
  </div>

  <!-- 背景 -->
  <div id="game-bg" class="game-bg bg-bedroom"></div>

  <!-- 雨エフェクト -->
  <div id="rain-overlay" class="rain-overlay"></div>

  <!-- キャラクター表示 -->
  <div class="char-area" id="char-area">
    <img
      id="char-sprite"
      class="char-sprite"
      src="./chara_normal.png"
      alt=""
      draggable="false"
    >
  </div><!-- /char-area -->

  <!-- コントロールボタン -->
  <div class="ctrl-buttons">
    <button class="ctrl-btn" id="btn-auto">AUTO</button>
    <button class="ctrl-btn" id="btn-skip">SKIP</button>
    <button class="ctrl-btn" id="btn-log">LOG</button>
    <button class="ctrl-btn" id="btn-save">SAVE</button>
    <button class="ctrl-btn" id="btn-menu">MENU</button>
  </div>

  <!-- メッセージウィンドウ -->
  <div class="msg-window">
    <div class="msg-box" id="msg-box">
      <div id="speaker-name" class="speaker-name speaker-narrator"></div>
      <div id="msg-text" class="msg-text narrator-style"></div>
      <div id="next-indicator" class="next-indicator"></div>
    </div>
  </div>

  <!-- 選択肢オーバーレイ -->
  <div class="choice-overlay" id="choice-overlay">
    <div class="choice-title" id="choice-title">選択してください</div>
    <div id="choice-buttons"></div>
  </div>

</div><!-- /screen-game -->


<!-- ===== セーブ画面 ===== -->
<div id="screen-save" class="screen">
  <div class="sub-screen-header">
    <button class="icon-btn" id="btn-back-save">←</button>
    <div class="sub-screen-title">SAVE</div>
    <div style="width:36px"></div>
  </div>
  <div class="save-slots" id="save-slot-container"></div>
</div>


<!-- ===== ロード画面 ===== -->
<div id="screen-load" class="screen">
  <div class="sub-screen-header">
    <button class="icon-btn" id="btn-back-load">←</button>
    <div class="sub-screen-title">LOAD</div>
    <div style="width:36px"></div>
  </div>
  <div class="save-slots" id="load-slot-container"></div>
</div>


<!-- ===== テキストログ画面 ===== -->
<div id="screen-log" class="screen">
  <div class="sub-screen-header">
    <button class="icon-btn" id="btn-back-log">←</button>
    <div class="sub-screen-title">TEXT LOG</div>
    <div style="width:36px"></div>
  </div>
  <div class="log-entries" id="log-entries"></div>
</div>


<!-- ===== 設定画面 ===== -->
<div id="screen-settings" class="screen">
  <div class="sub-screen-header">
    <button class="icon-btn" id="btn-back-settings">←</button>
    <div class="sub-screen-title">SETTINGS</div>
    <div style="width:36px"></div>
  </div>

  <div class="settings-section">
    <div class="settings-label">テキスト</div>

    <div class="settings-row">
      <div class="settings-row-label">文字送り速度</div>
      <input type="range" id="speed-slider" class="slider" min="10" max="90" value="65">
      <div class="settings-row-value" id="speed-val">65</div>
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-label">プレイヤー</div>
    <div class="settings-row">
      <div class="settings-row-label">あなたの名前</div>
      <div class="settings-row-value" id="settings-current-name">─</div>
    </div>
    <button class="btn btn-ghost" id="btn-change-name" style="margin-top:12px;width:100%">名前を変更する</button>
  </div>

  <div class="settings-section">
    <div class="settings-label">データ</div>
    <button class="btn btn-ghost" id="btn-title-from-settings"
            onclick="showScreen('title')" style="width:100%">タイトルに戻る</button>
  </div>
</div>


<!-- ===== エンディング画面 ===== -->
<div id="screen-ending" class="screen">
  <div id="game-bg-ending" class="game-bg bg-ending-bad" style="z-index:0"></div>

  <div class="ending-container">
    <div id="ending-label" class="ending-label">❌ Bad END</div>
    <div id="ending-title" class="ending-title">─</div>

    <div class="ending-score-display">
      <div class="ending-score-label">FINAL SCORE</div>
      <div id="ending-score-num" class="ending-score-num">0 pt</div>
    </div>

    <div class="ending-divider"></div>

    <div id="ending-text" class="ending-text"></div>

    <div class="ending-btn-group">
      <button class="btn btn-primary" id="btn-ending-retry">もう一度プレイする</button>
      <button class="btn btn-ghost"   id="btn-ending-title">タイトルへ戻る</button>
    </div>
  </div>
</div>


<!-- ===== フェードオーバーレイ ===== -->
<div class="fade-overlay" id="fade-overlay"></div>

<script src="./app.js"></script>
</body>
</html>
